#------------------------- esp32 + macros (прототип сценариев на Lua) -------------------------
[env:esp32_macrotest]
extends = env:esp32
; Собственная таблица партиций: app0/app1 больше (Lua-движок), spiffs меньше.
; Файл partitions_esp32_macro.csv лежит в корне ядра avr-fota.
board_build.partitions = partitions_esp32_macro.csv
src_filter = ${platformio.src_filter} +<module_macros/> +<module_udp/> +<module_otaclient/> +<module_editor/>
; Явный список флагов (не наследуем базовый DEBUG_OTA): логи только macros + wifi.
build_flags=
	-D CONNECTION_LED=2
	-D AP_ENABLE_BUTTON=-1
	-D USE_LITTLEFS
	-D MODULE_UDP=1
	-D MODULE_MACROS=1
	-D MODULE_EDITOR=1
	-D DEBUG_MACROS=1
	-D MODULE_OTACLIENT=1
	-D DEBUGLOG_WIFI
	-D RELEASE
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = module_macros
define = MODULE_MACROS
namespace = macros
web = 1
loop = 0
res = 1
prio = 60
priv = 1
