<!DOCTYPE html>
<html>
<head>
    <title>Macros</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <link rel="stylesheet" href="style.css">
    <style>
        .macros-layout { display: flex; gap: 6px; padding: 6px; align-items: stretch; height: calc(100vh - 150px); min-height: 420px; }
        .macros-left { flex: 0 0 38%; display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
        .macros-right { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-width: 320px; }
        .splitter { flex: 0 0 5px; cursor: col-resize; background: #ccc; border-radius: 3px; align-self: stretch; }
        .splitter:hover, body.split-drag .splitter { background: #7D8EE2; }
        body.split-drag { cursor: col-resize; user-select: none; }
        .panel { border: 1px solid #bbb; background: #fff; overflow: auto; flex: 1 1 auto; }
        .panel h4 { margin: 0; padding: 4px 6px; background: #eee; border-bottom: 1px solid #ccc; font-size: 13px; }
        #macTable { width: 100%; border-collapse: collapse; font-size: 12px; }
        #macTable th, #macTable td { border-bottom: 1px solid #e0e0e0; padding: 2px 4px; text-align: left; }
        #macTable tr.chk-sel { background: #fff7d6; }
        #macTable tr.sel { background: #dce7ff; }
        #macTable button.mini { font-size: 11px; line-height: 1; padding: 1px 3px; cursor: pointer; }
        #macTable button.mini.active { background: #7D8EE2; color: #fff; border-color: #5a6cc0; }
        .iconbar { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
        .iconbar button { cursor: pointer; }
        #resTree { font-size: 12px; padding: 2px; }
        #resTree .ns { font-weight: bold; cursor: pointer; margin-top: 3px; }
        #resTree .res { margin-left: 12px; cursor: pointer; }
        #resTree .res:hover { background: #eef; }
        #propPanel { font-size: 12px; padding: 4px; max-height: 130px; overflow: auto; }
        .editor-wrap { position: relative; flex: 1 1 auto; min-height: 200px; border: 1px solid #bbb; background: #fff; }
        .editor-wrap pre, .editor-wrap textarea {
            margin: 0; padding: 6px; width: 100%; height: 100%; box-sizing: border-box;
            font-family: Consolas, monospace; font-size: 13px; line-height: 1.35;
            white-space: pre-wrap; word-wrap: break-word; border: 0; overflow: auto;
        }
        .editor-wrap pre { position: absolute; inset: 0; color: #222; pointer-events: none; }
        .editor-wrap textarea { position: relative; background: transparent; color: transparent; caret-color: #000; resize: none; }
        .editor-wrap.locked { background: #f0f0f0; }
        .editor-wrap.locked pre { opacity: .5; }
        .kw { color: #0000cc; font-weight: bold; }
        .str { color: #a31515; }
        .cmt { color: #008000; }
        .num { color: #098658; }
    </style>
</head>
<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2"> <span id="devicename"></span> Macros</h2>

    <div class="iconbar" style="padding: 6px;">
        <button id="btnRefresh" onclick="refresh()">Refresh</button>
        <button onclick="actCreate()">Create</button>
        <button onclick="actRun()">Run</button>
        <button onclick="actStop()">Stop</button>
        <button onclick="actReload()">Reload</button>
        <button id="btnEdit" onclick="actEdit()">Edit</button>
        <button onclick="actRename()">Rename</button>
        <button onclick="actPrio(-1)">Prio -</button>
        <button onclick="actPrio(1)">Prio +</button>
        <button onclick="actDel()">Delete</button>
        <button onclick="validateMacros()">Валидация макросов</button>
        <span id="busy"></span>
        <span id="status" style="font-size:12px;color:#555;"></span>
    </div>
    <div id="heapInfo" style="padding: 2px 8px 6px; font-size:12px; font-family: monospace; color:#333;"></div>

    <div class="content">
        <div class="panel" style="max-height: 190px; flex: 0 0 auto;">
            <table id="macTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="chkAll" onclick="toggleAll(this.checked)"></th>
                        <th>prio</th><th>start/stop</th><th>name</th><th>cron</th>
                        <th>desc</th><th>run</th><th>err</th><th>created</th>
                    </tr>
                </thead>
                <tbody id="macBody"></tbody>
            </table>
        </div>
    </div>

    <div class="macros-layout">
        <div class="macros-left">
            <div class="panel">
                <h4>Resources <button onclick="loadResources()">Refresh</button></h4>
                <div id="resTree"></div>
            </div>
            <div class="panel" style="flex: 0 0 auto;">
                <h4>Properties</h4>
                <div id="propPanel">Click a resource to see details.</div>
            </div>
        </div>
        <div class="splitter" id="splitter" title="Перетащите, чтобы изменить ширину"></div>
        <div class="macros-right">
            <div class="iconbar">
                <span id="editName" style="font-size:12px;color:#555;">(no file)</span>
                <button onclick="validateBody()">Validate</button>
                <button id="btnSave" onclick="saveBody()">Save</button>
                <button id="btnOpenAce" style="display:none;" onclick="openInEditor()">Open in editor</button>
                <span id="editStatus" style="font-size:12px;color:#555;"></span>
            </div>
            <div class="editor-wrap" id="editorWrap">
                <pre id="hl"></pre>
                <textarea id="lua" spellcheck="true" oninput="onEdit()" onscroll="syncScroll()"></textarea>
            </div>
        </div>
    </div>

    <div class="footer">
        Module version: <span id="macrosversion"> </span> &nbsp;|&nbsp;
        Build: <span id="macrosgentime"> </span> <br>
    </div>

    <markup>./page_bottom.html</markup>
    <script src="GetJson.js" defer></script>
    <script src="GetMarkup.js" defer></script>
    <script>
        let SEL = new Set();
        let CUR_EDIT = null;
        let CUR_EDIT_RUN = false;
        let RUNMAP = {};
        let EDITOR_AVAILABLE = false;
        let CUR_TREE = {};

        function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function fmtDate(ts) { if (!ts) { return '-'; } const d = new Date(ts * 1000); return d.toLocaleString(); }

        async function api(url) {
            document.getElementById('busy').innerText = '...';
            try { return await (await fetch(url, { cache: 'no-store' })).text(); }
            finally { document.getElementById('busy').innerText = ''; }
        }

        async function refresh() {
            document.getElementById('busy').innerText = '...';
            try {
                const txt = await fetch('/macros/list', { cache: 'no-store' }).then(r => r.json());
                const body = document.getElementById('macBody');
                body.innerHTML = '';
                const files = txt.files || [];
                RUNMAP = {};
                for (const f of files) {
                    RUNMAP[f.name] = !!f.run;
                    const tr = document.createElement('tr');
                    tr.dataset.name = f.name;
                    const chk = document.createElement('input'); chk.type = 'checkbox';
                    chk.onclick = (e) => { e.stopPropagation(); toggleSel(f.name, chk.checked); };
                    const td0 = document.createElement('td'); td0.appendChild(chk);
                    tr.appendChild(td0);
                    tr.insertAdjacentHTML('beforeend', '<td>' + f.prio + '</td>');

                    // Колонка start/stop: две кнопки, активная подсвечена
                    const tdRun = document.createElement('td');
                    const bStart = document.createElement('button');
                    bStart.textContent = '\u25B6'; bStart.title = 'start';
                    bStart.className = 'mini' + (f.run ? ' active' : '');
                    bStart.onclick = (e) => { e.stopPropagation(); setRun(f.name, 1); };
                    const bStop = document.createElement('button');
                    bStop.textContent = '\u25A0'; bStop.title = 'stop';
                    bStop.className = 'mini' + (f.run ? '' : ' active');
                    bStop.onclick = (e) => { e.stopPropagation(); setRun(f.name, 0); };
                    tdRun.appendChild(bStart); tdRun.appendChild(bStop);
                    tr.appendChild(tdRun);

                    tr.insertAdjacentHTML('beforeend', '<td>' + esc(f.name) + '</td>');
                    const tdCron = document.createElement('td');
                    tdCron.textContent = f.cron || '';
                    tdCron.title = f.cron ? ('meta_cron: ' + f.cron) : '(нет meta_cron — активен всегда)';
                    tr.appendChild(tdCron);
                    tr.insertAdjacentHTML('beforeend',
                        '<td>' + esc(f.desc || '') + '</td>' +
                        '<td>' + (f.run ? 'on' : 'off') + '</td>' +
                        '<td title="' + esc(f.err) + '">' + (f.err ? '!' : '') + '</td>' +
                        '<td>' + fmtDate(f.created) + '</td>');
                    if (f.name === CUR_EDIT) { tr.classList.add('sel'); }
                    tr.onclick = () => selectRow(tr, f.name);
                    tr.ondblclick = () => actEdit();
                    body.appendChild(tr);
                }
                CUR_EDIT_RUN = !!RUNMAP[CUR_EDIT];
                syncSelUi();
                updateEditorLock();
            } finally {
                document.getElementById('busy').innerText = '';
            }
        }

        // Агрегация ответов нескольких endpoint-вызовов: все "OK" → "OK", иначе первый "ERR...".
        function aggStatus(results) {
            let err = "";
            for (const r of (results || [])) {
                const t = (r || "").trim();
                if (t !== "OK") { if (!err) { err = t; } }
            }
            return err || "OK";
        }

        async function setRun(name, on) {
            const r = await api('/macros/state?name=' + encodeURIComponent(name) + '&on=' + on);
            document.getElementById('status').innerText = r;
            await refresh();
        }

        // Валидация бюджета heap модуля: сервер оценивает занятую память
        // (файлы + правила + Lua + каталог) и сравнивает с лимитом.
        async function validateMacros() {
            const info = document.getElementById('heapInfo');
            info.style.color = '#333';
            info.innerText = 'Расчёт...';
            try {
                const r = await fetch('/macros/heap', { cache: 'no-store' }).then(x => x.json());
                const kb = v => (v / 1024).toFixed(1);
                let msg = 'heap: ' + kb(r.used) + ' / ' + kb(r.budget) + ' КБ (' + r.percent + '% от бюджета)';
                msg += '  |  файлов: ' + r.files + ' (активных ' + r.active + '), правил: ' + r.rules;
                msg += '  |  lua: ' + kb(r.lua) + ' КБ, каталог: ' + kb(r.catalog) + ' КБ';
                msg += '  |  free: ' + kb(r.free) + ' КБ';
                if (r.critical) {
                    info.style.color = '#c00000';
                    info.innerText = 'КРИТИЧНО! >' + r.limit + '% бюджета. ' + msg;
                } else {
                    info.style.color = '#1a7f1a';
                    info.innerText = 'OK. ' + msg;
                }
            } catch (e) {
                info.style.color = '#c00000';
                info.innerText = 'Ошибка валидации: ' + e;
            }
        }

        // SEL — множество чекбоксов для групповых действий.
        // CUR_EDIT — файл, открытый в редакторе. Это независимые состояния.
        function toggleSel(name, on) { if (on) { SEL.add(name); } else { SEL.delete(name); } syncSelUi(); }
        function selectRow(tr, name) {
            document.querySelectorAll('#macBody tr').forEach(r => r.classList.remove('sel'));
            tr.classList.add('sel');
            CUR_EDIT = name;
            CUR_EDIT_RUN = !!RUNMAP[name];
            openFile(name);
        }
        function syncSelUi() {
            let all = true;
            let none = true;
            document.querySelectorAll('#macBody tr').forEach(function (tr) {
                const on = SEL.has(tr.dataset.name);
                const c = tr.querySelector('input[type=checkbox]');
                if (c) { c.checked = on; }
                tr.classList.toggle('chk-sel', on);
                if (on) { none = false; } else { all = false; }
            });
            const hdr = document.getElementById('chkAll');
            if (hdr) { hdr.checked = all; hdr.indeterminate = (!all && !none); }
            updateEditorLock();
        }
        function toggleAll(on) {
            SEL.clear();
            if (on) {
                document.querySelectorAll('#macBody tr').forEach(function (tr) { SEL.add(tr.dataset.name); });
            }
            syncSelUi();
        }
        function firstSelected() {
            if (SEL.size === 1) { return SEL.values().next().value; }
            if (SEL.size === 0) { return CUR_EDIT; }
            return null;
        }

        async function actCreate() {
            const r = await api('/macros/create?name=new_macros.lua');
            document.getElementById('status').innerText = r; refresh();
        }
        async function actRun() { await runState(1); }
        async function actStop() { await runState(0); }
        async function runState(on) {
            const results = [];
            for (const n of SEL) {
                results.push(await api('/macros/state?name=' + encodeURIComponent(n) + '&on=' + on));
            }
            document.getElementById('status').innerText = aggStatus(results);
            refresh();
        }
        async function actReload() {
            const n = firstSelected();
            const r = await api('/macros/reload' + (n ? '?name=' + encodeURIComponent(n) : ''));
            document.getElementById('status').innerText = r;
            refresh();
        }
        async function actPrio(dir) {
            const results = [];
            for (const n of SEL) {
                results.push(await api('/macros/prio?name=' + encodeURIComponent(n) + '&dir=' + dir));
            }
            document.getElementById('status').innerText = aggStatus(results);
            refresh();
        }
        async function actDel() {
            if (!SEL.size || !confirm('Delete selected?')) { return; }
            const r = await api('/macros/delete?name=' + encodeURIComponent([...SEL].join(',')));
            document.getElementById('status').innerText = r;
            SEL.clear(); refresh();
        }
        async function actRename() {
            const n = firstSelected(); if (!n) { return; }
            const nn = prompt('New name', n);
            if (!nn || nn === n) { return; }
            const r = await api('/macros/rename?old=' + encodeURIComponent(n) + '&new=' + encodeURIComponent(nn));
            document.getElementById('status').innerText = r;
            refresh();
        }
        function actEdit() {
            const n = firstSelected(); if (!n) { return; }
            openFile(n);
        }
        async function openFile(name) {
            document.getElementById('editName').innerText = name;
            const body = await (await fetch('/macros/get?name=' + encodeURIComponent(name), { cache: 'no-store' })).text();
            document.getElementById('lua').value = body;
            onEdit();
            updateEditorLock();
        }

        // Запущенные сценарии — только просмотр: правка/Save доступны после Stop.
        function updateEditorLock() {
            const ta = document.getElementById('lua');
            const wrap = document.getElementById('editorWrap');
            const btn = document.getElementById('btnSave');
            if (!ta || !btn) { return; }
            ta.readOnly = CUR_EDIT_RUN;
            if (wrap) { wrap.classList.toggle('locked', CUR_EDIT_RUN); }
            btn.disabled = CUR_EDIT_RUN;
            btn.title = CUR_EDIT_RUN ? 'Остановите сценарий для сохранения' : '';
        }

        function openInEditor() {
            if (!CUR_EDIT) {
                document.getElementById('status').innerText = 'ERR: no file selected';
                return;
            }
            window.open('edit.html?file=' + encodeURIComponent('/macros/' + CUR_EDIT), '_blank');
        }
        async function saveBody() {
            // Сохраняем всегда в файл, открытый в редакторе (CUR_EDIT),
            // а не в случайно выбранный чекбоксом.
            const n = CUR_EDIT;
            if (!n) { document.getElementById('editStatus').innerText = 'ERR: no file'; return; }
            if (RUNMAP[n]) {
                document.getElementById('editStatus').innerText = 'ERR: stop scenario first';
                return;
            }
            const r = await api('/macros/save?name=' + encodeURIComponent(n) + '&body=' + encodeURIComponent(document.getElementById('lua').value));
            document.getElementById('editStatus').innerText = r;
            if (r.trim() !== 'OK') { alert(r); }
            refresh();
        }
        async function validateBody() {
            const r = await api('/macros/validate?body=' + encodeURIComponent(document.getElementById('lua').value));
            document.getElementById('editStatus').innerText = r;
        }

        // ---- Подсветка Lua через CSS-оверлей ----
        function highlight(src) {
            let out = esc(src);
            out = out.replace(/(--[^\n]*)/g, '<span class="cmt">$1</span>');
            out = out.replace(/(&quot;|&#39;|"[^"]*"|'[^']*')/g, '<span class="str">$1</span>');
            out = out.replace(/\b(function|end|if|then|else|elseif|local|return|nil|true|false|and|or|not|for|while|do|break|repeat|until|in)\b/g, '<span class="kw">$1</span>');
            out = out.replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
            return out + '\n';
        }
        function onEdit() {
            const ta = document.getElementById('lua');
            document.getElementById('hl').innerHTML = highlight(ta.value);
            syncScroll();
        }
        function syncScroll() {
            const ta = document.getElementById('lua');
            const hl = document.getElementById('hl');
            hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
        }

        // ---- Дерево ресурсов ----
        async function loadResources() {
            const data = await (await fetch('/macros/resources', { cache: 'no-store' })).json();
            const feat = data.features || {};
            EDITOR_AVAILABLE = (feat.editor === 1);
            document.getElementById('btnEdit').style.display = EDITOR_AVAILABLE ? '' : 'none';
            const btnAce = document.getElementById('btnOpenAce');
            if (btnAce) { btnAce.style.display = EDITOR_AVAILABLE ? '' : 'none'; }
            const tree = document.getElementById('resTree');
            tree.innerHTML = '';
            const groups = {};
            for (const r of (data.resources || [])) {
                const ns = r.ns || 'core';
                (groups[ns] = groups[ns] || []).push(r);
            }
            CUR_TREE = groups;
            Object.keys(groups).sort().forEach(ns => {
                const div = document.createElement('div');
                div.className = 'ns';
                div.innerText = '▾ ' + ns;
                tree.appendChild(div);
                groups[ns].forEach(r => {
                    const el = document.createElement('div');
                    el.className = 'res';
                    const flags = (r.rw ? 'rw ' : '') + (r.e ? 'e ' : '') + (r.a ? 'a ' : '');
                    el.innerText = '• ' + r.name + ' [' + r.kind + '] ' + flags;
                    el.onclick = () => showProps(r);
                    el.ondblclick = () => insertSnippet(r);
                    tree.appendChild(el);
                });
            });
        }
        function showProps(r) {
            let h = '<b>' + esc(r.full) + '</b><br>' + esc(r.desc || '');
            h += '<br>kind: ' + r.kind + ' | ro: ' + !r.rw + ' | func: ' + !!r.f + ' | async: ' + !!r.a + ' | event: ' + !!r.e;
            if (r.enum) { h += '<br>enum: ' + r.enum.join(', '); }
            if (r.codes) { r.codes.forEach(c => { h += '<br>code ' + c.code + ': ' + esc(c.meaning); }); }
            document.getElementById('propPanel').innerHTML = h;
        }
        function insertSnippet(r) {
            if (CUR_EDIT_RUN) { return; }   // запущенный сценарий — только просмотр
            const ta = document.getElementById('lua');
            let s;
            if (r.f) { s = (r.a ? '-- async: вызывается движком, без callback\n' : '') + 'call("' + r.full + '")'; }
            else { s = 'get("' + r.full + '")'; }
            const p = ta.selectionStart;
            ta.value = ta.value.slice(0, p) + s + ta.value.slice(ta.selectionEnd);
            ta.selectionStart = ta.selectionEnd = p + s.length;
            ta.focus(); onEdit();
        }

        // ---- Подвижный разделитель панелей ----
        let _splitDrag = false;
        function initSplitter() {
            const layout = document.querySelector('.macros-layout');
            const left = document.querySelector('.macros-left');
            const split = document.getElementById('splitter');
            if (!layout || !left || !split) { return; }

            const saved = parseInt(localStorage.getItem('macros_left_width'), 10);
            if (saved > 0) { left.style.flex = '0 0 ' + saved + 'px'; }

            split.addEventListener('mousedown', function (e) {
                _splitDrag = true;
                document.body.classList.add('split-drag');
                e.preventDefault();
            });
            document.addEventListener('mousemove', function (e) {
                if (!_splitDrag) { return; }
                const r = layout.getBoundingClientRect();
                let w = e.clientX - r.left;
                const max = Math.max(200, r.width - 320);
                if (w < 200) { w = 200; }
                if (w > max) { w = max; }
                left.style.flex = '0 0 ' + w + 'px';
            });
            document.addEventListener('mouseup', function () {
                if (!_splitDrag) { return; }
                _splitDrag = false;
                document.body.classList.remove('split-drag');
                localStorage.setItem('macros_left_width', String(Math.round(left.getBoundingClientRect().width)));
            });
            split.addEventListener('dblclick', function () {
                left.style.flex = '0 0 38%';
                localStorage.removeItem('macros_left_width');
            });
        }

        window.onload = function() {
            setTimeout(() => {
                ApplyCVT("/system/version").then(() => ApplyCVT("/macros/ver"));
            }, 500);
            initSplitter();
            refresh();
            loadResources();
        };
    </script>
</body>
</html>
