#------------------------- esp32 + macros (прототип сценариев на Lua) -------------------------
[env:esp32_macro]
extends = env:esp32
; Единая таблица ESP32 (app0/app1 1472 КБ, spiffs 1080 КБ) из корня ядра.
board_build.partitions = partitions_esp32.csv
src_filter = ${platformio.src_filter} +<module_macros/> +<module_udp/> +<module_otaclient/> +<module_ds3231/> +<module_i2c-mapper/> 
; Явный список флагов (не наследуем базовый DEBUG_OTA): логи только macros + wifi.
build_flags=
	-D USE_LITTLEFS
	-D CONNECTION_LED=2
	-D AP_ENABLE_BUTTON=-1
	-D DEBUG_STATE=1
	-D DEBUG_MACROS=1
	-D DEBUG_CORE_WIFI=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}


#------------------------- esp32 + macros (прототип сценариев на Lua) -------------------------
[env:esp32_nonmacro]
extends = env:esp32
; Единая таблица ESP32 (app0/app1 1472 КБ, spiffs 1080 КБ) из корня ядра.
board_build.partitions = partitions_esp32.csv
src_filter = ${platformio.src_filter} +<module_udp/> +<module_otaclient/> +<module_i2c-mapper/> 
; Явный список флагов (не наследуем базовый DEBUG_OTA): логи только macros + wifi.
build_flags=
	-D USE_LITTLEFS
	-D CONNECTION_LED=2
	-D AP_ENABLE_BUTTON=-1
	-D DEBUG_STATE=1
	-D DEBUG_MACROS=1
	-D DEBUG_CORE_WIFI=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}


#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = module_macros
define = MODULE_MACROS
namespace = macros
web = 1
loop = 0
res = 1
prio = 60
priv = 1
